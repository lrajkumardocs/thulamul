name: imagebank
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "எந்தத் துறைகள் (இடைவெளியால் பிரித்து). காலி = அனைத்தும்"
        required: false
        default: "court"
      per:
        description: "ஒரு துறைக்கு எத்தனை படம்"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pillow
      - name: படங்களை உருவாக்கு
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data/bank
          python pipeline/build_imagebank.py --per ${{ github.event.inputs.per }} \
            ${{ github.event.inputs.topics != '' && format('--only {0}', github.event.inputs.topics) || '' }}
      - name: சேமி
        run: |
          git config user.name "thulamul-bot"
          git config user.email "bot@thulamul"
          git config pull.rebase false
          git add data/bank data/bank_index.json
          git diff --cached --quiet || git commit -m "imagebank: $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --no-rebase -X ours origin main && git push && break
            sleep 5
          done
