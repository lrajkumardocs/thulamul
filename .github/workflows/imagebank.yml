name: imagebank
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "துறைகள் — இதை மாற்ற வேண்டாம், அப்படியே Run அழுத்துங்கள்"
        required: true
        default: "economy health govt tech india world sports cinema weather transport power local accident pension env space defence"
      per:
        description: "ஒரு துறைக்கு அதிகபட்சம்"
        required: true
        default: "99"
      redo:
        description: "மீண்டும் உருவாக்க — காலியாக விடுங்கள்"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: நூலகங்கள்
        run: pip install requests pillow
      - name: படங்களை உருவாக்கு
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPICS: ${{ github.event.inputs.topics }}
          PER: ${{ github.event.inputs.per }}
          REDO: ${{ github.event.inputs.redo }}
        run: |
          echo "=============================================="
          echo " துறைகள்  : [$TOPICS]"
          echo " அதிகபட்சம் : [$PER]"
          echo " redo     : [$REDO]"
          echo "=============================================="
          mkdir -p data/bank
          if [ -n "$REDO" ]; then
            python pipeline/build_imagebank.py --per "$PER" --only $TOPICS --redo $REDO
          else
            python pipeline/build_imagebank.py --per "$PER" --only $TOPICS
          fi
      - name: சேமி
        if: always()
        run: |
          git config user.name "thulamul-bot"
          git config user.email "bot@thulamul"
          git config pull.rebase false
          git add data/bank data/bank_index.json || true
          git diff --cached --quiet || git commit -m "imagebank $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --no-rebase -X ours origin main && git push && break
            sleep 5
          done
