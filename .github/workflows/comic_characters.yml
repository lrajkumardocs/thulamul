name: comic-characters
on:
  workflow_dispatch:
    inputs:
      chars:
        description: "all அல்லது id-கள் (எ.கா. nandini,kundavai)"
        default: "all"
        required: true

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Generate character sheets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHARS: ${{ github.event.inputs.chars }}
          PYTHONUNBUFFERED: "1"
        run: python pipeline/gen_characters.py
      - name: Commit refs
        run: |
          git config user.name "thulamul-bot"
          git config user.email "bot@thulamul"
          git add pipeline/comic_refs/
          git diff --cached --quiet || git commit -m "comic: character sheets ($CHARS)"
          for i in 1 2 3; do
            git pull --no-rebase -X ours origin main && git push && break
            sleep 5
          done
        env:
          CHARS: ${{ github.event.inputs.chars }}
