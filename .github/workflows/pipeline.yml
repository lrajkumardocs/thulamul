name: thulamul-pipeline
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL: claude-sonnet-5
          MAX_NEW_PER_RUN: "12"
        run: |
          mkdir -p data/audio data/news
          python pipeline/run.py
      - name: Commit data
        run: |
          git config user.name "thulamul-bot"
          git config user.email "bot@thulamul"
          git add data/
          git diff --cached --quiet || git commit -m "news: $(date -u +'%Y-%m-%d %H:%M')"
          git push
