<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#7a1f1f">
<title>நூலகம் · துலாமுள்</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1613; --ink2:#5b5048; --line:#e0d8cc; --paper:#f7f4ee;
  --card:#fffdfa; --brand:#7a1f1f; --brand2:#a8862f; --ok:#2f6b3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans Tamil",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
}
a{color:var(--brand)}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- gate ---------- */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.gbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
      border-radius:14px;padding:30px 26px;box-shadow:0 10px 34px rgba(0,0,0,.07)}
.gbox h1{margin:0;font-size:26px;letter-spacing:.5px;color:var(--brand)}
.gbox .sub{margin:4px 0 22px;font-size:13px;color:var(--ink2)}
.gbox label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.gbox input{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;
            border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.gbox input:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{width:100%;margin-top:14px;padding:12px 16px;font-size:15px;font-weight:600;
     background:var(--brand);color:#fff;border:0;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.msg{margin-top:14px;font-size:13.5px;line-height:1.6;padding:11px 13px;border-radius:9px;display:none}
.msg.on{display:block}
.msg.ok{background:#eef6ef;color:var(--ok);border:1px solid #cfe3d2}
.msg.err{background:#fdeeee;color:#9b2226;border:1px solid #f0d2d2}
.msg.info{background:#f3f0e8;color:var(--ink2);border:1px solid var(--line)}
.foot{margin-top:20px;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.7}

/* ---------- app ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:12px 16px;display:flex;align-items:center;gap:12px}
header.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.4px}
header.top .who{margin-left:auto;font-size:11.5px;opacity:.85;text-align:right;line-height:1.35}
header.top button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:7px;padding:5px 10px;font-size:12px}

.stats{display:flex;gap:0;background:var(--card);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.stats div{flex:1 0 auto;min-width:96px;padding:11px 14px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:19px;color:var(--brand)}
.stats span{font-size:11px;color:var(--ink2)}

.wrap{max-width:1000px;margin:0 auto;padding:16px}

.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar input{flex:1;padding:11px 14px;font-size:15px;font-family:inherit;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.searchbar button{padding:0 16px;font-size:14px;border:1px solid var(--line);
  background:var(--card);border-radius:9px;color:var(--ink)}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calhead b{font-size:16px}
.calhead button{background:var(--paper);border:1px solid var(--line);border-radius:7px;
  width:32px;height:32px;font-size:16px;line-height:1;color:var(--ink)}
.calhead .sp{margin-left:auto}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid7 .dow{text-align:center;font-size:11px;color:var(--ink2);padding:2px 0;font-weight:600}
.day{aspect-ratio:1;max-height:62px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;color:#b9b0a5;position:relative}
.day.has{background:#fff;color:var(--ink);border-color:#d6c9b4;cursor:pointer;font-weight:600}
.day.has:hover{border-color:var(--brand);background:#fffaf5}
.day.has.sel,.day.has.sel:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.day .n{font-size:9.5px;opacity:.75;margin-top:1px}
.day.blank{border:0;background:transparent}

/* day view */
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 12px;
  padding-bottom:9px;border-bottom:2px solid var(--brand)}
.dayhead h2{margin:0;font-size:20px}
.dayhead .c{font-size:12.5px;color:var(--ink2)}
.dayhead .acts{margin-left:auto;display:flex;gap:7px}
.dayhead .acts button{font-size:12px;padding:5px 11px;border:1px solid var(--line);
  background:var(--card);border-radius:7px;color:var(--ink)}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:15px 16px;margin-bottom:12px}
.card.feat{border-left:4px solid var(--brand2)}
.card h3{margin:0 0 7px;font-size:17px;line-height:1.45}
.card .meta{font-size:11.5px;color:var(--ink2);margin-bottom:9px;display:flex;
  gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:20px;
  padding:1px 9px;font-size:11px;color:var(--brand)}
.card p{margin:0 0 7px;font-size:14.5px}
.card .close{font-style:italic;color:var(--ink2);font-size:13.5px}
/* படம் வெட்டப்படக் கூடாது — ஆவணக் காப்பகம், அலங்காரம் அல்ல */
.card img.ph{width:100%;height:auto;border-radius:8px;margin:4px 0 10px;
  background:#efece6;display:block;cursor:zoom-in}
.card img.tall{max-width:760px;margin-left:auto;margin-right:auto}
.card .cred{font-size:10.5px;color:var(--ink2);margin:-6px 0 10px}
.card audio{width:100%;margin-top:8px;height:34px}
.card .src{font-size:11px;color:var(--ink2);margin-top:8px}
.jump{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.jump button{font-size:12.5px;padding:6px 14px;border:1px solid var(--line);
  background:var(--card);border-radius:20px;color:var(--brand);font-weight:600}
.jump button:hover{background:#fff;border-color:var(--brand)}
[id^="s-"]{scroll-margin-top:64px}
.hit{font-size:11.5px;color:var(--brand);font-weight:600;margin-bottom:4px}
.empty{padding:36px 16px;text-align:center;color:var(--ink2);font-size:14px}
@media (max-width:520px){ .wrap{padding:12px} .card{padding:13px} }
@media print{
  header.top,.stats,.searchbar,.cal,.dayhead .acts,#gate{display:none!important}
  body{background:#fff} .card{break-inside:avoid;border-color:#ccc}
}
</style>
</head>
<body>

<!-- ============ உள்நுழைவு ============ -->
<div id="gate">
  <div class="gbox">
    <h1>துலாமுள் நூலகம்</h1>
    <div class="sub">தனிப்பட்ட ஆவணக் காப்பகம் · அனுமதிக்கப்பட்டவர்களுக்கு மட்டும்</div>

    <div id="gForm">
      <label for="em">மின்னஞ்சல் முகவரி</label>
      <input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
      <button class="btn" id="send">உள்நுழைவு இணைப்பு அனுப்பு</button>
    </div>

    <div id="gWait" class="hide">
      <button class="btn" disabled id="waitBtn">சரிபார்க்கிறது…</button>
    </div>

    <div class="msg" id="gMsg"></div>
    <div class="foot">
      கடவுச்சொல் இல்லை. உங்கள் மின்னஞ்சலுக்கு ஒரு இணைப்பு வரும்,<br>அதைச் சொடுக்கினால் உள்ளே வந்துவிடலாம்.
      <br><br>முத்தமிழ் கலைக்கூடம்
    </div>
  </div>
</div>

<!-- ============ நூலகம் ============ -->
<div id="app" class="hide">
  <header class="top">
    <h1>நூலகம்</h1>
    <div class="who"><span id="uEmail"></span></div>
    <button id="out">வெளியேறு</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="wrap">
    <div class="searchbar">
      <input id="q" type="search" placeholder="எல்லா நாட்களிலும் தேடு — சொல், பெயர், இடம்…">
      <button id="qclr">அழி</button>
    </div>

    <div class="cal" id="cal"></div>
    <div id="out1"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, sendSignInLinkToEmail,
         isSignInWithEmailLink, signInWithEmailLink }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const fb = initializeApp({
  apiKey:"AIzaSyB3aUM0tQKByUaUg4jMGpHFDuVokkjFXg8",
  authDomain:"thulamul.firebaseapp.com",
  projectId:"thulamul",
  storageBucket:"thulamul.firebasestorage.app",
  messagingSenderId:"1075780759307",
  appId:"1:1075780759307:web:d10b25f39a1b54bc96fc0e"
});
const auth = getAuth(fb);

/* அனுமதிக்கப்பட்ட மின்னஞ்சல்கள் — SHA-256 மறையாக்கம்.
   வெளிப்படையாக எழுதவில்லை; spam bot அறுவடை செய்ய முடியாது. */
const ALLOWED = [
  "64ef5c1aabb4577dcbe858e04f3fa45862523da8be96a9d4962b161868144f08",
  "6d68ebe6259a820614ea12f0d2ffb25229846870ee3f5aad44806e6b24279792"
];
async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

const $ = id => document.getElementById(id);
const gate=$("gate"), app=$("app"), gMsg=$("gMsg"), gForm=$("gForm"), gWait=$("gWait");
function say(t, k){ gMsg.className = "msg on " + (k||"info"); gMsg.innerHTML = t; }
function clearSay(){ gMsg.className = "msg"; }

const LINK_KEY = "tl_lib_email";
const actionCodeSettings = { url: location.origin + "/lib/", handleCodeInApp: true };

$("send").onclick = async () => {
  const em = ($("em").value||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ say("சரியான மின்னஞ்சல் முகவரியைத் தட்டச்சு செய்யுங்கள்.","err"); return; }
  if(!ALLOWED.includes(await sha256(em))){
    say("இந்த முகவரிக்கு நூலக அனுமதி இல்லை.","err"); return;
  }
  $("send").disabled = true; say("அனுப்புகிறது…","info");
  try{
    await sendSignInLinkToEmail(auth, em, actionCodeSettings);
    try{ localStorage.setItem(LINK_KEY, em); }catch(e){}
    gForm.classList.add("hide");
    say("<b>இணைப்பு அனுப்பப்பட்டது.</b><br>"+em+" க்கு வந்திருக்கும் மின்னஞ்சலைத் திறந்து அந்த இணைப்பைச் சொடுக்குங்கள்.<br><br>வரவில்லையா? spam / promotions கோப்புறையைப் பாருங்கள்.","ok");
  }catch(e){
    $("send").disabled = false;
    say("அனுப்ப முடியவில்லை: " + (e.code||e.message),"err");
  }
};

/* மின்னஞ்சல் இணைப்பிலிருந்து திரும்பி வந்தால் */
(async () => {
  if(!isSignInWithEmailLink(auth, location.href)) return;
  gForm.classList.add("hide"); gWait.classList.remove("hide");
  let em = "";
  try{ em = localStorage.getItem(LINK_KEY) || ""; }catch(e){}
  if(!em){
    gWait.classList.add("hide");
    say("இந்த இணைப்பை வேறு சாதனத்தில் திறந்திருக்கிறீர்கள். உறுதிப்படுத்த மின்னஞ்சல் முகவரியை மீண்டும் தட்டச்சு செய்யுங்கள்.","info");
    gForm.classList.remove("hide");
    $("send").textContent = "உறுதிப்படுத்து";
    $("send").onclick = async () => {
      const e2 = ($("em").value||"").trim().toLowerCase();
      try{ await signInWithEmailLink(auth, e2, location.href); }
      catch(err){ say("உள்நுழைய முடியவில்லை: " + (err.code||err.message),"err"); }
    };
    return;
  }
  try{
    await signInWithEmailLink(auth, em, location.href);
    history.replaceState(null,"",location.origin + "/lib/");
  }catch(e){
    gWait.classList.add("hide"); gForm.classList.remove("hide");
    say("இணைப்பு காலாவதியாகிவிட்டது அல்லது ஏற்கனவே பயன்படுத்தப்பட்டது. மீண்டும் அனுப்புங்கள்.","err");
  }
})();

onAuthStateChanged(auth, async (u) => {
  if(!u){ gate.classList.remove("hide"); app.classList.add("hide"); return; }
  const em = (u.email||"").toLowerCase();
  if(!ALLOWED.includes(await sha256(em))){
    await signOut(auth);
    gWait.classList.add("hide"); gForm.classList.remove("hide");
    say("இந்தக் கணக்குக்கு நூலக அனுமதி இல்லை.","err");
    return;
  }
  $("uEmail").textContent = em;
  gate.classList.add("hide"); app.classList.remove("hide");
  boot();
});
$("out").onclick = () => signOut(auth).then(()=>location.reload());

/* ================= நூலகம் ================= */
const R = "../";            // களஞ்சிய வேர்
const D = R + "data/";
const TOPIC_TA = {tn:"தமிழ்நாடு", india:"இந்தியா", world:"உலகம்", economy:"பொருளாதாரம்",
  court:"நீதிமன்றம்", crime:"சட்டம் ஒழுங்கு", govt:"அரசு அறிவிப்பு", jobs:"வேலைவாய்ப்பு",
  health:"சுகாதாரம்", cinema:"சினிமா", sports:"விளையாட்டு", tech:"தொழில்நுட்பம்",
  editorial:"தலையங்கம்", assembly:"சட்டப்பேரவை"};
const TA_M = ["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்",
              "செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
const DOW = ["ஞா","தி","செ","பு","வி","வெ","ச"];

let INDEX = [], COMICS = {}, EDIT = {}, CACHE = {}, curMonth = null, curDay = null;

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jget = async p => { const r = await fetch(D+p+"?v="+Date.now()); if(!r.ok) throw 0; return r.json(); };
const asset = p => R + String(p||"").replace(/^\.?\//,"");   // "data/..." → "../data/..."
const side = x => {
  if(!x) return "";
  if(typeof x === "string") return `<p>${esc(x)}</p>`;
  const pts = (x.points||[]).map(p => `<p>• ${esc(p)}</p>`).join("");
  return `<p><b>${esc(x.label||"")}</b></p>${pts}`;
};
const taDate = ds => { const [y,m,d] = ds.split("-").map(Number); return d + " " + TA_M[m-1] + " " + y; };

async function boot(){
  try{ INDEX = await jget("issues/index.json"); }catch(e){ INDEX = []; }
  try{ (await jget("comic_index.json")).forEach(c => COMICS[c.date] = c); }catch(e){}
  try{ EDIT = await jget("editorial_archive.json"); }catch(e){ EDIT = {}; }

  const days = INDEX.length, stories = INDEX.reduce((a,x)=>a+(x.count||0),0);
  $("stats").innerHTML =
    `<div><b>${days}</b><span>நாள்</span></div>
     <div><b>${stories}</b><span>செய்தி</span></div>
     <div><b>${Object.keys(COMICS).length}</b><span>காமிக்ஸ்</span></div>
     <div><b>${Object.keys(EDIT).length}</b><span>தலையங்கம்</span></div>
     <div><b>${INDEX.length?taDate(INDEX[INDEX.length-1].date):"—"}</b><span>தொடக்கம்</span></div>`;

  const latest = INDEX.length ? INDEX[0].date : null;
  curMonth = latest ? latest.slice(0,7) : new Date().toISOString().slice(0,7);
  drawCal();
  if(latest) openDay(latest);
}

function drawCal(){
  const [Y,M] = curMonth.split("-").map(Number);
  const have = {}; INDEX.forEach(x => have[x.date] = x.count);
  const first = new Date(Y, M-1, 1).getDay();
  const last  = new Date(Y, M, 0).getDate();
  let cells = DOW.map(d => `<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first;i++) cells += `<div class="day blank"></div>`;
  for(let d=1; d<=last; d++){
    const ds = `${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n = have[ds];
    cells += n
      ? `<div class="day has ${ds===curDay?"sel":""}" data-d="${ds}">${d}<span class="n">${n}</span></div>`
      : `<div class="day">${d}</div>`;
  }
  $("cal").innerHTML =
    `<div class="calhead">
       <button id="pm">‹</button><b>${TA_M[M-1]} ${Y}</b><button id="nm">›</button>
       <span class="sp"></span>
     </div><div class="grid7">${cells}</div>`;
  $("pm").onclick = () => { shiftMonth(-1); };
  $("nm").onclick = () => { shiftMonth(1); };
  $("cal").querySelectorAll(".day.has").forEach(el => el.onclick = () => openDay(el.dataset.d));
}
function shiftMonth(k){
  let [Y,M] = curMonth.split("-").map(Number);
  M += k; if(M<1){M=12;Y--;} if(M>12){M=1;Y++;}
  curMonth = `${Y}-${String(M).padStart(2,"0")}`; drawCal();
}

async function loadDay(ds){
  if(CACHE[ds]) return CACHE[ds];
  const arr = await jget("issues/"+ds+".json");
  CACHE[ds] = arr; return arr;
}

async function openDay(ds){
  curDay = ds; drawCal();
  $("out1").innerHTML = `<div class="empty">ஏற்றுகிறது…</div>`;
  let arr;
  try{ arr = await loadDay(ds); }
  catch(e){ $("out1").innerHTML = `<div class="empty">இந்த நாளின் கோப்பு கிடைக்கவில்லை.</div>`; return; }

  const hasEd = !!EDIT[ds];
  const hasCm = !!(COMICS[ds] && !COMICS[ds].hidden);
  let h = `<div class="dayhead">
     <h2>${taDate(ds)}</h2><span class="c">${arr.length} செய்தி</span>
     <div class="acts">
       <button id="dl">JSON சேமி</button>
       <button id="pr">அச்சிடு / PDF</button>
     </div></div>
   <div class="jump">
     ${hasEd?`<button data-go="s-ed">தலையங்கம்</button>`:""}
     <button data-go="s-news">செய்திகள்</button>
     ${hasCm?`<button data-go="s-comic">காமிக்ஸ்</button>`:""}
   </div>`;

  const ed = EDIT[ds];
  if(ed){
    h += `<div class="card feat" id="s-ed"><div class="meta"><span class="chip">தராசில் இன்று</span></div>
      <h3>${esc(ed.title)}</h3>
      ${ed.cartoon_file ? `<img class="ph tall" loading="lazy" src="${esc(asset(ed.cartoon_file))}" alt=""
        onclick="window.open(this.src,'_blank')">
        ${ed.cartoon_caption?`<div class="cred">${esc(ed.cartoon_caption)}</div>`:""}` : ""}
      <p>${esc(ed.issue||"")}</p>
      ${side(ed.side_a)}${side(ed.side_b)}
      ${ed.history?`<p>${esc(ed.history)}</p>`:""}
      ${ed.question?`<p class="close">${esc(ed.question)}</p>`:""}
      ${ed.audio?`<audio controls preload="none" src="${esc(asset(ed.audio))}"></audio>`:""}</div>`;
  }


  h += `<div id="s-news"></div>` + arr.map(s => storyCard(s)).join("");   // map-இன் index-ஐ தேதியாக அனுப்பக் கூடாது

  // காமிக்ஸ் கடைசியாக — செய்தித்தாளில் அது பக்கம் 18
  const cm = COMICS[ds];
  if(cm && !cm.hidden){
    h += `<div class="card feat" id="s-comic"><div class="meta"><span class="chip">காமிக்ஸ்</span>
      <span>நாள் ${cm.day} · ${esc(cm.book_ta||"")}</span></div>
      <h3>${esc(cm.title)}</h3>
      <img class="ph tall" loading="lazy" src="${esc(asset(cm.file))}" alt=""
        onclick="window.open(this.src,'_blank')">
      <p>${esc(cm.summary||"")}</p></div>`;
  }
  $("out1").innerHTML = h;
  $("dl").onclick = () => {
    const b = new Blob([JSON.stringify(arr,null,1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "thulamul-"+ds+".json"; a.click();
  };
  $("pr").onclick = () => window.print();
  $("out1").querySelectorAll(".jump button").forEach(btn => btn.onclick = () => {
    const el = document.getElementById(btn.dataset.go);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function storyCard(s, showDate){
  const im = s.image && s.image.url ? s.image : null;
  const lines = (s.lines||[]).map(x => `<p>${esc(x)}</p>`).join("");
  const srcs = (s.sources||[]).map(x => esc(x.name||x)).join(" · ");
  return `<div class="card">
    <div class="meta">
      <span class="chip">${esc(TOPIC_TA[s.topic]||s.topic_ta||s.topic||"")}</span>
      ${showDate?`<span>${taDate(showDate)}</span>`:""}
      ${s.published_at?`<span>${esc(String(s.published_at).slice(11,16))}</span>`:""}
    </div>
    <h3>${esc(s.headline)}</h3>
    ${im?`<img class="ph" loading="lazy" src="${esc(im.url)}" alt=""
           onclick="window.open(this.src,'_blank')"
           onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='none')">
          <div class="cred">${esc(im.credit||"")}${im.license?" · "+esc(im.license):""}</div>`:""}
    ${lines}
    ${s.closing?`<p class="close">${esc(s.closing)}</p>`:""}
    ${s.audio?`<audio controls preload="none" src="${esc(asset(s.audio))}"></audio>`:""}
    ${srcs?`<div class="src">மூலம்: ${srcs}</div>`:""}
  </div>`;
}

/* ---------- தேடல் ---------- */
let searching = false;
$("q").addEventListener("keydown", e => { if(e.key==="Enter") runSearch(); });
$("qclr").onclick = () => { $("q").value=""; if(curDay) openDay(curDay); };

async function runSearch(){
  const q = ($("q").value||"").trim();
  if(q.length < 2){ if(curDay) openDay(curDay); return; }
  const ql = q.toLowerCase();
  if(searching) return; searching = true;
  $("out1").innerHTML = `<div class="empty">எல்லா நாட்களிலும் தேடுகிறது…</div>`;
  const hits = [];
  for(const it of INDEX){
    let arr; try{ arr = await loadDay(it.date); }catch(e){ continue; }
    for(const s of arr){
      const blob = [s.headline, ...(s.lines||[]), s.closing].join(" ");
      if(blob.toLowerCase().includes(ql)) hits.push([it.date, s]);
    }
  }
  searching = false;
  $("out1").innerHTML = hits.length
    ? `<div class="dayhead"><h2>“${esc(q)}”</h2><span class="c">${hits.length} செய்தி</span></div>`
      + hits.map(([d,s]) => storyCard(s, d)).join("")
    : `<div class="empty">“${esc(q)}” — ஒன்றும் கிடைக்கவில்லை.</div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
